; PlatformIO project for ESP32 coin acceptor firmware
; Target: ESP32-WROOM-32 dev board
; Sibling repo to C:\Projects\RentalSystem — wire contracts live there in
; src/RentalShared/Mqtt/MqttTopics.cs and ProjectContext/esp32-wiring.md.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; Explicit OTA-capable partition layout. `default.csv` reserves two app
; slots (app0 + app1) plus an ota_data slot, so ArduinoOTA can write the
; pending firmware into the inactive slot and swap on reboot. This is
; the default for esp32dev, but pinning it here prevents a future PlatformIO
; update from silently switching to a non-OTA scheme like `huge_app.csv`.
board_build.partitions = default.csv
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    tzapu/WiFiManager@^2.0.17

; ----------------------------------------------------------------------------
; OTA upload — once the coin box is sealed, switch to this env to push
; firmware over WiFi via mDNS hostname instead of USB serial:
;
;     pio run -e esp32dev-ota -t upload
;
; The OTA password is read from $env:RENTAL_COIN_OTA_PASSWORD so it
; doesn't land in git. Before running, set it to whatever you put in
; include/config.h's OTA_PASSWORD define:
;
;     $env:RENTAL_COIN_OTA_PASSWORD = "<your OTA password>"
;     pio run -e esp32dev-ota -t upload
; ----------------------------------------------------------------------------
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = coin-01.local
upload_flags =
    --port=3232
    --auth=${sysenv.RENTAL_COIN_OTA_PASSWORD}

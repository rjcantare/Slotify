# RentalSystem server broker config — written by the server installer to
# C:\Program Files\mosquitto\mosquitto.conf after silent-installing Mosquitto.
#
# Mosquitto 2.0+ defaults to localhost-only + anonymous DENIED. The shop
# clients connect over the LAN with no credentials, so both lines below are
# required or every client is silently refused.
#
# To switch to authenticated brokering later (see S53 + the Mosquitto auth
# migration doc): set "allow_anonymous false", add "password_file
# C:\Program Files\mosquitto\passwd", create users with mosquitto_passwd,
# and set the matching username/password in the server + client installers.

listener 1883 0.0.0.0
allow_anonymous true

# Persist retained messages + queued QoS-1 across broker restarts so a
# server reboot does not lose the retained session/rates/status slots.
persistence true
persistence_location C:\Program Files\mosquitto\
